<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Claude AI Enterprise Platform</title>
  <meta name="description" content="AI File Processing, AI Toolkit, Prompt Optimization, and Cost Monitoring Platform with Anthropic Claude API">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .auth-wrapper {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 10;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all var(--transition-fast);
    }
    .auth-tab.active {
      color: #fff;
      border-bottom-color: var(--accent-primary);
    }
    .demo-accounts-box {
      margin-top: 24px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
    }
    .demo-accounts-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .demo-btns-row {
      display: flex;
      gap: 10px;
    }
    .demo-btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .demo-btn:hover {
      background: rgba(99, 102, 241, 0.25);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <h1>Claude AI Enterprise</h1>
          <span>AI Toolkit & Usage Platform</span>
        </div>
      </div>

      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" type="button">Sign In</button>
        <button id="tab-register" class="auth-tab" type="button">Create Account</button>
      </div>

      <!-- Login Form Pane -->
      <div id="login-pane">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-input" placeholder="name@domain.com" required autofocus>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign In to Platform</button>
        </form>
      </div>

      <!-- Register Form Pane -->
      <div id="register-pane" style="display: none;">
        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input type="text" id="reg-name" class="form-input" placeholder="Alex Morgan" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="name@domain.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password (min. 6 characters)</label>
            <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-role">Account Role</label>
            <select id="reg-role" class="form-select">
              <option value="USER" selected>Standard User</option>
              <option value="ADMIN">System Administrator</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Create Account</button>
        </form>
      </div>

      <!-- Quick Demo Login Helpers -->
      <div class="demo-accounts-box">
        <div class="demo-accounts-title">Quick Demo Login</div>
        <div class="demo-btns-row">
          <button type="button" id="btn-fill-admin" class="demo-btn">Fill Admin (Full System)</button>
          <button type="button" id="btn-fill-user" class="demo-btn">Fill User (Workspace)</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
